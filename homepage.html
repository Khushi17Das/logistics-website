<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - FleetXpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
<header>
  <div class="navbar">
    <h2 onclick="location.href='homepage.html'" style="cursor:pointer;">FLEETXPRESS.</h2>
    <div>
      <a href="homepage.html">Home</a>
      <a href="services.html">Services</a>
      <a href="tracking.html">Tracking</a>
      <a href="contact.html">Contact</a>
      <button class="login-btn" onclick="openLogin()">Login</button>
    </div>
  </div>
</header>

<main>
    <section id="home" class="active-section">
        <div class="hero">
          <div class="hero-box">
            <h1>Logistics & Transport</h1>
            <p>Delivering beyond borders with speed and safety.</p>
            <button onclick="navTo('quote')">Get Quote</button>
          </div>
        </div>
    </section>

    <section id="quote" class="quote">
      <h2>Request a Quote</h2>
      <form class="quote-form">
        <input placeholder="Name">
        <input placeholder="Phone">
        <input placeholder="Email">
        <input placeholder="Ship From">
        <input placeholder="Ship To">
        <input placeholder="Package Details">
        <button type="button">Submit</button>
      </form>
    </section>

    <footer>
      <p>FleetXpress Logistics</p>
      <p>Email: support@fleetxpress.com | Phone: +91 9004021371</p>
      <p>© 2026 FleetXpress. All rights reserved.</p>
    </footer>
</main>

<div class="modal" id="loginModal">
  <div class="modal-box">
    <h3>Login</h3>
    <input placeholder="Email">
    <input placeholder="Password" type="password">
    <button class="login-btn" style="width:100%; margin:0;">Login</button>
    <p onclick="closeLogin()" style="margin-top: 10px; color: gray; cursor:pointer;">Close</p>
  </div>
</div>

<script src="JS/page.js"></script>

</body>
</html>
