<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking - FleetXpress</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

<header>
  <div class="navbar">
    <h2 onclick="location.href='homepage.html'" style="cursor:pointer;">FLEETXPRESS.</h2>
    <div>
      <a href="homepage.html">Home</a>
      <a href="services.html">Services</a>
      <a href="tracking.html">Tracking</a>
      <a href="contact.html">Contact</a>
      <button class="login-btn" onclick="openLogin()">Login</button>
    </div>
  </div>
</header>

<main>
    <section id="track" class="track" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-top: 100px; min-height: 70vh;">
      
      <h2 style="font-weight: 800; font-size: 36px; color:white; margin-bottom: 30px; text-transform: uppercase;">
        Track Your Shipment
      </h2>

      <div class="track-form" style="display: flex; flex-direction: column; align-items: center; gap: 15px;">
          <input type="text" placeholder="Tracking ID" 
                 style="padding: 12px; width: 320px; border-radius: 5px; border: 2px solid #ddd; color:black; font-size: 16px;">
          
          <button class="login-btn" style="margin: 0; width: 180px; height: 50px; font-size: 18px;">
            Track Now
          </button>
      </div>
    </section>
</main>

<footer>
  <p>FleetXpress Logistics</p>
  <p>Email: support@fleetxpress.com | Phone: +91 9004021371</p>
  <p>© 2026 FleetXpress. All rights reserved.</p>
</footer>

<div class="modal" id="loginModal">
  <div class="modal-box">
    <h3>Login</h3>
    <input placeholder="Email">
    <input placeholder="Password" type="password">
    <button class="login-btn" style="width:100%; margin:0;">Login</button>
    <p onclick="closeLogin()" style="margin-top: 10px; color: gray; cursor:pointer;">Close</p>
  </div>
</div>

<script src="JS/page.js"></script>

</body>
</html>
